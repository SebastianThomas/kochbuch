# NOT applied by kustomize. `kochbuch-secrets` is created/updated by the
# `release` workflow via homelab-actions/kube-secret, from these GitHub
# Environment (`production`) secrets:
#
#   MONGO_ROOT_PASSWORD   -> key mongo-root-password   (MongoDB root password; also builds MONGO_URI)
#   PUSH_PUBLIC_KEY       -> key push-public-key       (VAPID)
#   PUSH_PRIVATE_KEY      -> key push-private-key      (VAPID)
#   PUSH_SUBJECT          -> key push-subject          (mailto: or https: URL)
#   MAIL_USER             -> key mail-user             (SMTP username/mailbox for /api/send)
#   MAIL_PASS             -> key mail-pass             (SMTP password)
#
# MAIL_HOST / MAIL_PORT are not secret - set them directly in
# deploy/deployment.yaml for your mail server.
#
# To create/rotate by hand instead (needs a kubeconfig for the cluster):
#
#   kubectl -n kochbuch create secret generic kochbuch-secrets \
#     --from-literal=mongo-root-password='...' \
#     --from-literal=push-public-key='...' \
#     --from-literal=push-private-key='...' \
#     --from-literal=push-subject='mailto:kochbuch-push@sthomas.ch' \
#     --from-literal=mail-user='kochbuch@your-domain.example' \
#     --from-literal=mail-pass='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: kochbuch-secrets
  namespace: kochbuch
type: Opaque
stringData:
  mongo-root-password: "change-me"
  push-public-key: "change-me"
  push-private-key: "change-me"
  push-subject: "mailto:kochbuch-push@sthomas.ch"
  mail-user: "change-me"
  mail-pass: "change-me"
