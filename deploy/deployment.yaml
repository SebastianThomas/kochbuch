---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kochbuch
  labels:
    app: kochbuch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kochbuch
  template:
    metadata:
      labels:
        app: kochbuch
    spec:
      containers:
        - name: kochbuch
          image: ${APP_IMAGE}   # substituted by homelab-actions/kube-deploy
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kochbuch-secrets
                  key: mongo-root-password
            # built from the password above so there's one source of truth
            - name: MONGO_URI
              value: "mongodb://root:$(MONGO_ROOT_PASSWORD)@kochbuch-db:27017/recipes?authSource=admin"
            - name: PUSH_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: kochbuch-secrets, key: push-public-key } }
            - name: PUSH_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: kochbuch-secrets, key: push-private-key } }
            - name: PUSH_SUBJECT
              valueFrom: { secretKeyRef: { name: kochbuch-secrets, key: push-subject } }
            # SMTP for /api/send - custom mailbox, not a public/secret value so
            # it lives here rather than in kochbuch-secrets. EDIT MAIL_HOST for
            # your provider; MAIL_PORT/MAIL_SECURE default to implicit TLS :465
            # (set MAIL_PORT "587" and add MAIL_SECURE "false" for STARTTLS).
            - name: MAIL_HOST
              value: "ha01s012.org-dns.com"
            - name: MAIL_PORT
              value: "465"
            - name: MAIL_USER
              valueFrom: { secretKeyRef: { name: kochbuch-secrets, key: mail-user } }
            - name: MAIL_PASS
              valueFrom: { secretKeyRef: { name: kochbuch-secrets, key: mail-pass } }
          readinessProbe:
            httpGet: { path: /, port: 5000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 5000 }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { memory: 256Mi }
