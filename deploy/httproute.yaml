---
# kochbuch -> the kochbuch Service, via the shared Traefik Gateway. Traefik is
# the public edge and terminates TLS (cert-manager gateway certs). Both the
# .homelab and the bare .sthomas.ch name resolve here; the legacy
# docker-compose kochbuch.sthomas.ch is retired.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kochbuch
  namespace: kochbuch
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - kochbuch.homelab.sthomas.ch
    - kochbuch.sthomas.ch
  rules:
    - backendRefs:
        - name: kochbuch
          port: 80
